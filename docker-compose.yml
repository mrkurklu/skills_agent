services:
  backend:
    build: ./backend
    container_name: skillflow-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build: ./frontend
    container_name: skillflow-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always